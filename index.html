<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flash N Dash — Walkable Painted 3D Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #0c1126; font-family: system-ui, sans-serif; }
    #hud {
      position: fixed; top: 14px; left: 14px; z-index: 10;
      color: #f6e7c8; font-size: 13px;
      background: rgba(11, 16, 36, 0.85); border: 1px solid rgba(255, 196, 80, 0.25);
      padding: 8px 14px; border-radius: 8px;
    }
  </style>
</head>
<body>
  <div id="hud"><strong>Flash N Dash</strong> • WASD / Arrows: Walk • Mouse Drag: Look / Orbit • Scroll: Zoom</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0c1126);
    scene.fog = new THREE.FogExp2(0x0c1126, 0.014);

    const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 250);
    camera.position.set(-13.2, 2.55, 14.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0.35, 2.55, 0);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.495;

    // Ground street plane
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(90, 90),
      new THREE.MeshBasicMaterial({ color: 0x13182e })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.25;
    scene.add(ground);

    // Load the Baked Painted GLB
    const glbUrl = new URL('./flash_n_dash.glb', window.location.href).href;
    new GLTFLoader().load(glbUrl, (gltf) => {
      gltf.scene.traverse((child) => {
        if (child.isMesh && child.material) {
          // Render unlit so the baked illustration colors & brushwork stay 100% vibrant!
          child.material = new THREE.MeshBasicMaterial({
            map: child.material.map
          });
        }
      });
      scene.add(gltf.scene);
    });

    // WASD / Arrow Key Walking
    const keys = {};
    window.addEventListener('keydown', (e) => keys[e.code] = true);
    window.addEventListener('keyup', (e) => keys[e.code] = false);

    const forward = new THREE.Vector3();
    const right = new THREE.Vector3();

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    renderer.setAnimationLoop(() => {
      const speed = 0.14;
      camera.getWorldDirection(forward);
      forward.y = 0;
      forward.normalize();
      right.crossVectors(forward, camera.up).normalize();

      if (keys['KeyW'] || keys['ArrowUp']) {
        camera.position.addScaledVector(forward, speed);
        controls.target.addScaledVector(forward, speed);
      }
      if (keys['KeyS'] || keys['ArrowDown']) {
        camera.position.addScaledVector(forward, -speed);
        controls.target.addScaledVector(forward, -speed);
      }
      if (keys['KeyA'] || keys['ArrowLeft']) {
        camera.position.addScaledVector(right, -speed);
        controls.target.addScaledVector(right, -speed);
      }
      if (keys['KeyD'] || keys['ArrowRight']) {
        camera.position.addScaledVector(right, speed);
        controls.target.addScaledVector(right, speed);
      }

      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
