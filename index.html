<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flash N Dash — 3D Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #0c1026; font-family: system-ui, -apple-system, sans-serif; }
    #hud {
      position: fixed; top: 14px; left: 14px; z-index: 10;
      color: #f6e7c8; font-size: 13px; line-height: 1.4;
      background: rgba(12, 16, 38, 0.82); border: 1px solid rgba(246, 231, 200, 0.2);
      padding: 10px 14px; border-radius: 8px; backdrop-filter: blur(4px);
    }
    #status { margin-top: 4px; color: #ffae42; font-weight: 600; }
  </style>
</head>
<body>
  <div id="hud">
    <div><strong>Flash N Dash</strong> • Left-drag: Orbit • Right-drag: Pan • Scroll: Zoom</div>
    <div id="status">Loading flash_n_dash.glb...</div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const statusEl = document.getElementById('status');

    // Scene & Twilight Fog
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1530);
    scene.fog = new THREE.FogExp2(0x0f1530, 0.016);

    // Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 250);
    camera.position.set(-14, 7.5, 15.5);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    // Controls (Touch + Mouse friendly)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.2, 0);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI * 0.49;

    // Ground Plane
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(80, 80),
      new THREE.MeshBasicMaterial({ color: 0x1a2038 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // Resolve relative to current page directory (works in /Repo-Name/ subpaths on GitHub Pages)
    const modelUrl = new URL('./flash_n_dash.glb', window.location.href).href;

    const loader = new GLTFLoader();
    loader.load(
      modelUrl,
      (gltf) => {
        gltf.scene.traverse((child) => {
          if (child.isMesh && child.material) {
            const oldMat = child.material;
            child.material = new THREE.MeshBasicMaterial({
              map: oldMat.map || null,
              color: oldMat.map ? 0xffffff : oldMat.color
            });
          }
        });
        scene.add(gltf.scene);
        statusEl.textContent = 'Model loaded';
        statusEl.style.color = '#4ade80';
      },
      (xhr) => {
        if (xhr.total > 0) {
          const pct = Math.round((xhr.loaded / xhr.total) * 100);
          statusEl.textContent = `Loading model... ${pct}%`;
        }
      },
      (err) => {
        console.error('GLB load error:', err);
        statusEl.textContent = 'Could not load ./flash_n_dash.glb — check that the filename is lowercase in the same folder.';
        statusEl.style.color = '#f87171';
      }
    );

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop(() => {
      controls.update();
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
